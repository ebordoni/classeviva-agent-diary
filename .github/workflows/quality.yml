name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify:addon-sources
      - run: npm run check
      - run: npm test

  build-addons:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        addon: [classeviva-bot, classeviva-ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: >-
          docker build
          --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-debian:bookworm
          --tag classeviva-${{ matrix.addon }}:ci
          hassio-addon/${{ matrix.addon }}
