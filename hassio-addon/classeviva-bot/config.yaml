name: "Classeviva Bot"
description: "Telegram bot per Classeviva — consulta voti, lezioni, compiti direttamente da Telegram."
version: "1.7.1"
slug: "classeviva_bot"
init: false

# Architetture supportate (RPi 4 = aarch64, RPi 3 = armv7)
arch:
  - aarch64
  - armv7
  - amd64

# Volume /data persistente (cache, gestito da HA Supervisor)
# Volume /share condiviso con altri addon (es. classeviva-ui)
map:
  - data:rw
  - share:rw

# Opzioni configurabili dall'interfaccia HA
options:
  telegram_token: ""
  ai_provider: "openai"
  ai_model: ""
  ai_api_key: ""
  allowed_chat_ids: ""
  daily_digest_time: ""

schema:
  telegram_token: str
  ai_provider: str
  ai_model: str?
  ai_api_key: str?
  allowed_chat_ids: str?
  daily_digest_time: str?

# Nessuna porta esposta — il bot usa long-polling Telegram
